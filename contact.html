     <!--contacts-->
    <section class="py-5 bg-dark">
        <div class="container">
            <div class="text-center mb-5">
                <h3 class="h3 text-pink-50 pt-5 m-2">GET IN TOUCH</h3>
                <h1 class="fw-bold text-light d-4">Contact Me</h1>
                <p class="text-light">Have a project or opportunity? Feel free to contact me♡</p>
            </div>
            <div class="container my-4" style="max-width:500px">
                <form class="needs-validation border p-3" novalidate>

                    <div class="mb-3">
                        <label class="form-label text-light">Your name:</label>
                        <input type="text" class="form-control" placeholder="Enter your name" required>
                        <div class="invalid-feedback">Please enter your name.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Your Email:</label>
                        <input type="email" class="form-control" placeholder="Enter your email" required>
                        <div class="invalid-feedback">Please enter your name.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Phone:</label>
                        <input type="tel" class="form-control" placeholder="phone number" required>
                        <div class="invalid-feedback">Please enter your phone number.</div>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-pink">Send Message</button>
                    </div>
                </form>
